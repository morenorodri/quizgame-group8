<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/quiz.css">
    <script defer src="./js/quiz.js"></script>
    <title> Quiz Game By Group 8 </title>
</head>
<body>
        
    <header class="quiz-header">
        <nav class="naw-wrapper">
            <img src="./assets/javascript-icon.svg" alt="javascript-logo">

            <button class="close-btn button-round" aria-label="Close quiz">x</button>
        </nav>
    </header>


    <main>
        <div class="timer-container">
            <div class="timer-bar">
                <div class="timer-progress">
                    
                </div>
            </div>
            <span class="timer-text">20s</span>
        </div>

        <div class="question-card">
            <p class="question-count">Question 3 / 10</p>
            <p class="question">Question</p>
        </div>
        
        <div class="answers">
            <button class="answer">Answer</button>
            <button class="answer">Answer</button>
            <button class="answer">Answer</button>
            <button class="answer">Answer</button>
        </div>
    </main>


    <footer>
        <span class="foot-mark"> Quiz-game by group 8 </span>
    </footer>
    <script src="./js/theme.js"></script>
</body>
</html>
