<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/result.css" />

    <title>Quiz Result</title>
  </head>

  <body>
    <!-- Header -->
    <header>
      <nav class="nav-wrapper">
        <div class="small-img-frame left-position">
          <img src="./img/javascript-icon.svg" alt="JavaScript logo" />
        </div>
      </nav>
    </header>

    <!-- Main content -->
    <main>
      <div class="main-wrapper">
        <section class="result-card">
          <img
            class="trophy-img"
            src="img/trophy (1).png"
            alt="Winner trophy"
          />

          <h1>
            Great Job,<br />
            <span id="player-name">Player</span>!
          </h1>

          <div class="score-box">
            <div class="score">
              <h2 id="correct-answers">0 / 10</h2>
              <p>Correct</p>
            </div>

            <div class="score">
              <h2 id="total-points">0</h2>
              <p>Points</p>
            </div>
          </div>
        </section>

        <!-- Result buttons -->
        <div class="result-buttons">
          <a href="./leading-board.html" class="join-btn">
            <span>Join The Score Table</span>
            <img src="img/arrow-right.png" alt="" />
          </a>

          <a href="./index.html" class="restart-btn">
            <span>New Round</span>
            <img src="img/restart.png" alt="" />
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <div class="foot-wrapper">
        <button class="button-round" type="button">I</button>
        <button class="button-round" type="button">T</button>
        <button class="button-round" type="button">F</button>
      </div>
    </footer>
    <script type="module" src="./js/result.js"></script>
  </body>
</html>
